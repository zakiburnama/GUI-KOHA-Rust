[package]
name = "koha-app"
description = "Binary `koha`: merangkai core, platform, dan gui."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Nama paket `koha-app`, tetapi file hasil build-nya `koha` / `koha.exe`.
[[bin]]
name = "koha"
path = "src/main.rs"

[dependencies]
koha-core.workspace = true
koha-platform.workspace = true
koha-gui.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
directories = "6.0.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Jejak waktu start; membangun dengan --features startup-trace.
startup-trace = ["koha-gui/startup-trace"]
